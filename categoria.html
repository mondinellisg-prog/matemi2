<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | MATEMI</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --verde-yerba: #557A46; --verde-oscuro: #2D4A22; --marron-tierra: #6B4423; --blanco: #FDFBF7; --texto: #333; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Open Sans', sans-serif; background: var(--blanco); color: var(--texto); }
        header { background: var(--verde-oscuro); color: white; padding: 25px; text-align: center; }
        header h1 { font-family: 'Lora', serif; font-size: 32px; margin-top: 10px; }
        header a { color: #f0c29a; text-decoration: none; font-size: 14px; text-transform: uppercase; font-weight: bold; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card h3 { font-family: 'Lora', serif; font-size: 20px; color: var(--marron-tierra); margin-bottom: 8px; }
        .card p { font-size: 14px; color: #666; margin-bottom: 15px; flex-grow: 1; }
        .card .precio { font-size: 22px; font-weight: bold; color: var(--verde-oscuro); margin-bottom: 15px; }
        .btn-comprar { background: #25d366; color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-comprar:hover { background: #1ebd50; }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Volver a la Tienda</a>
        <h1 id="categoriaTitulo">Cargando...</h1>
    </header>

    <div class="container">
        <div class="grid-productos" id="productosGrid"></div>
    </div>

    <script>
        async function cargarProductos() {
            // Lee qué categoría se pasó por URL (ej: categoria.html?cat=mates)
            const params = new URLSearchParams(window.location.search);
            const catId = params.get('cat');

            const tituloEl = document.getElementById('categoriaTitulo');
            const gridEl = document.getElementById('productosGrid');

            try {
                const res = await fetch('content/catalogo.json?v=' + Date.now());
                const data = await res.json();
                
                // Busca la categoría seleccionada
                const categoria = (data.categorias || []).find(c => c.id === catId);

                if (!categoria) {
                    tituloEl.textContent = "Categoría no encontrada";
                    gridEl.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">La categoría solicitada no existe o fue eliminada.</p>';
                    return;
                }

                tituloEl.textContent = "Catálogo de " + categoria.nombre;

                if (!categoria.productos || categoria.productos.length === 0) {
                    gridEl.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No hay productos cargados en esta categoría todavía.</p>';
                    return;
                }

                gridEl.innerHTML = categoria.productos.map(p => `
                    <div class="card">
                        <img src="${p.foto}" alt="${p.nombre}">
                        <h3>${p.nombre}</h3>
                        <p>${p.descripcion || ''}</p>
                        <div class="precio">$${p.precio} ARS</div>
                        <a href="https://wa.me/5491154251118?text=Hola!%20Quiero%20consultar%20por:%20${encodeURIComponent(p.nombre)}" target="_blank" class="btn-comprar">
                            <i class="fab fa-whatsapp"></i> Pedir por WhatsApp
                        </a>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                tituloEl.textContent = "Error al cargar";
            }
        }

        cargarProductos();
    </script>
</body>
</html>
