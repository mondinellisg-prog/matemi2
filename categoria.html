<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | MATEMI</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --verde-yerba: #557A46; --verde-oscuro: #2D4A22; --marron-tierra: #6B4423; --blanco: #FDFBF7; --texto: #333; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Open Sans', sans-serif; background: var(--blanco); color: var(--texto); }
        header { background: var(--verde-oscuro); color: white; padding: 25px; text-align: center; }
        header h1 { font-family: 'Lora', serif; font-size: 32px; margin-top: 10px; }
        header a { color: #f0c29a; text-decoration: none; font-size: 14px; text-transform: uppercase; font-weight: bold; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card h3 { font-family: 'Lora', serif; font-size: 20px; color: var(--marron-tierra); margin-bottom: 8px; }
        .card p { font-size: 14px; color: #666; margin-bottom: 15px; flex-grow: 1; }
        .card .precio { font-size: 22px; font-weight: bold; color: var(--verde-oscuro); margin-bottom: 15px; }
        .btn-comprar { background: #25d366; color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-comprar:hover { background: #1ebd50; }
/* Contenedor relativo para posicionar la etiqueta sobre la foto */
.card-img-wrap {
    position: relative;
    width: 100%;
    height: 220px;
    border-radius: 10px;
    overflow: hidden;
}

/* Etiquetas (Badges) */
.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    color: white;
    z-index: 2;
    text-transform: uppercase;
}
.badge-descuento { background-color: #557A46; /* Verde */ }
.badge-agotado { background-color: #d9534f; /* Rojo */ }

/* Fila de Categoría y Rating */
.card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #888;
    margin: 8px 0 4px;
}
.card-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
    color: #333;
}
.card-rating i { color: #f5a623; }

/* Precios */
.precios-box {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 10px 0;
}
.precio-actual {
    font-size: 20px;
    font-weight: 700;
    color: #557A46;
}
.precio-tachado {
    font-size: 14px;
    color: #999;
    text-decoration: line-through;
}

    </style>
</head>
<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Volver a la Tienda</a>
        <h1 id="categoriaTitulo">Cargando...</h1>
    </header>

    <div class="container">
        <div class="grid-productos" id="productosGrid"></div>
    </div>

    <script>
        async function cargarProductos() {
            // Lee qué categoría se pasó por URL (ej: categoria.html?cat=mates)
            const params = new URLSearchParams(window.location.search);
            const catId = params.get('cat');

            const tituloEl = document.getElementById('categoriaTitulo');
            const gridEl = document.getElementById('productosGrid');

            try {
                const res = await fetch('content/catalogo.json?v=' + Date.now());
                const data = await res.json();
                
                // Busca la categoría seleccionada
                const categoria = (data.categorias || []).find(c => c.id === catId);

                if (!categoria) {
                    tituloEl.textContent = "Categoría no encontrada";
                    gridEl.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">La categoría solicitada no existe o fue eliminada.</p>';
                    return;
                }

                tituloEl.textContent = "Catálogo de " + categoria.nombre;

                if (!categoria.productos || categoria.productos.length === 0) {
                    gridEl.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No hay productos cargados en esta categoría todavía.</p>';
                    return;
                }

 // Función para dar formato de pesos con puntos de miles (ej: 35000 -> $35.000)
const formatearMoneda = (monto) => {
    return new Intl.NumberFormat('es-AR', {
        style: 'currency',
        currency: 'ARS',
        maximumFractionDigits: 0
    }).format(monto);
};

gridEl.innerHTML = categoria.productos.map(p => {
    const precioBase = Number(p.precio_base) || 0;
    const descuentoPorcentaje = Number(p.descuento) || 0;

    let precioFinal = precioBase;
    let precioTachadoHtml = '';
    let badgeHtml = '';

    // Si tiene descuento y no está en 0:
    if (descuentoPorcentaje > 0 && descuentoPorcentaje < 100) {
        // Calcula el precio con el descuento aplicado
        precioFinal = Math.round(precioBase * (1 - (descuentoPorcentaje / 100)));
        // Muestra el precio base tachado
        precioTachadoHtml = `<span class="precio-tachado">${formatearMoneda(precioBase)}</span>`;
        // Cartelito verde
        badgeHtml = `<span class="badge badge-descuento">${descuentoPorcentaje}% off</span>`;
    }

    // Si el producto está agotado, pisa el cartel de descuento por el de Agotado
    if (p.agotado) {
        badgeHtml = `<span class="badge badge-agotado">Agotado</span>`;
    }

    const ratingValor = p.rating || '5.0';

    return `
        <div class="card">
            <div class="card-img-wrap">
                ${badgeHtml}
                <img src="${p.foto}" alt="${p.nombre}" loading="lazy">
            </div>

            <div class="card-meta">
                <span>${categoria.nombre || 'Mates'}</span>
                <span class="card-rating">⭐ ${ratingValor}</span>
            </div>

            <h3>${p.nombre}</h3>
            <p>${p.descripcion || ''}</p>

            <div class="precios-box">
                <span class="precio-actual">${formatearMoneda(precioFinal)}</span>
                ${precioTachadoHtml}
            </div>

            <a href="https://wa.me/5491154251118?text=Hola!%20Quiero%20consultar%20por:%20${encodeURIComponent(p.nombre)}" 
               target="_blank" 
               class="btn-comprar" 
               style="${p.agotado ? 'background:#888; pointer-events:none;' : ''}">
                <i class="fab fa-whatsapp"></i> ${p.agotado ? 'Sin Stock' : 'Pedir por WhatsApp'}
            </a>
        </div>
    `;
}).join('');

            } catch (err) {
                console.error(err);
                tituloEl.textContent = "Error al cargar";
            }
        }

        cargarProductos();
    </script>
</body>
</html>
