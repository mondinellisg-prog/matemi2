<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | MATEMI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-washi: #F7F5F0;
            --surface: #FFFFFF;
            --text-primary: #151614;
            --text-secondary: #706F6A;
            --accent-forest: #222D1E;
            --accent-bronze: #9E8256;
            --border-subtle: rgba(21, 22, 20, 0.08);
            --border-focus: rgba(21, 22, 20, 0.2);
            --whatsapp: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-washi); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }

        /* HEADER CÁPSULA */
        .top-nav {
            padding: 24px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(247, 245, 240, 0.9);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(15px);
        }
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            letter-spacing: 2.5px;
            font-weight: 700;
        }

        /* FILTROS Y CABECERA */
        .catalog-header {
            padding: 60px 6% 30px;
            text-align: center;
        }
        .catalog-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(34px, 5vw, 56px);
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* PÍLDORAS DE CATEGORÍA */
        .filter-pills {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .pill-btn:hover { border-color: var(--border-focus); color: var(--text-primary); }
        .pill-btn.active {
            background: var(--text-primary);
            color: #FFF;
            border-color: var(--text-primary);
        }

        /* CONTROLES SECUNDARIOS (ORDEN) */
        .catalog-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6% 25px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .sort-select {
            padding: 9px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            background: var(--surface);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* GRILLA DE PRODUCTOS ESTILO TOKIO */
        .shop-container { padding: 0 6% 80px; max-width: 1450px; margin: 0 auto; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.35s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-focus);
            box-shadow: 0 16px 32px rgba(0,0,0,0.06);
        }
        .img-wrap {
            height: 330px;
            background: #EDEAE4;
            position: relative;
            overflow: hidden;
        }
        .img-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s ease;
        }
        .product-card:hover .img-wrap img { transform: scale(1.06); }
        
        .badge-tag {
            position: absolute;
            top: 14px; left: 14px;
            background: rgba(21, 22, 20, 0.85);
            color: #FFF;
            backdrop-filter: blur(8px);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .badge-agotado { background: #B33927; }

        .card-details { padding: 22px; }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-bronze);
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 19px;
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.35;
            color: var(--text-primary);
        }
        .card-pricing {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .price-current {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .price-strike {
            font-size: 14px;
            color: #9E9D96;
            text-decoration: line-through;
        }

        /* --- 6. DRAWER MODAL / FICHA TÉCNICA LATERAL --- */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 2000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .drawer-overlay.active { opacity: 1; pointer-events: all; }
        
        .drawer-sheet {
            position: fixed;
            top: 0; right: -500px;
            width: 100%; max-width: 480px;
            height: 100%;
            background: var(--surface);
            z-index: 2001;
            box-shadow: -10px 0 40px rgba(0,0,0,0.2);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }
        .drawer-sheet.active { right: 0; }
        .drawer-close {
            position: absolute; top: 25px; right: 25px;
            background: none; border: none; font-size: 20px;
            cursor: pointer; color: var(--text-secondary);
        }
        .drawer-img {
            width: 100%; height: 340px;
            border-radius: 12px;
            margin: 20px 0;
            object-fit: cover;
        }
        .btn-whatsapp-drawer {
            background: var(--text-primary);
            color: #FFF;
            padding: 18px;
            border-radius: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .btn-whatsapp-drawer:hover { background: var(--accent-forest); }

        @media (max-width: 600px) {
            .drawer-sheet { max-width: 100%; top: auto; bottom: -100%; right: 0; height: 90vh; border-radius: 24px 24px 0 0; transition: bottom 0.4s ease; }
            .drawer-sheet.active { bottom: 0; right: 0; }
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN -->
    <header class="top-nav">
        <a href="index.html" class="brand-title">MATEMI</a>
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px;">
            <a href="index.html" style="color: var(--text-secondary); margin-right: 18px;">INICIO</a>
            <a href="https://wa.me/5491154251118" target="_blank" style="color: var(--accent-bronze);">CONSULTAS</a>
        </div>
    </header>

    <!-- CABECERA DE TIENDA -->
    <div class="catalog-header">
        <span style="font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-bronze); font-weight: 700;">Colección Oficial</span>
        <h1 id="tituloTienda">Catálogo de Piezas</h1>
        <div class="filter-pills" id="pillsContainer"></div>
    </div>

    <!-- CONTROLES -->
    <div class="catalog-controls">
        <span id="contadorProductos">Cargando catálogo...</span>
        <select id="selectOrden" class="sort-select" onchange="cambiarOrden(this.value)">
            <option value="destacados">Ordenar: Colección</option>
            <option value="precio-menor">Precio: Menor a Mayor</option>
            <option value="precio-mayor">Precio: Mayor a Menor</option>
            <option value="descuento">Con Descuento (% OFF)</option>
        </select>
    </div>

    <!-- CONTENEDOR DE PRODUCTOS -->
    <main class="shop-container">
        <div class="products-grid" id="productosGrid"></div>
    </main>

    <!-- DRAWER LATERAL (FICHA TÉCNICA AL TOCAR EL PRODUCTO) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="cerrarFicha()"></div>
    <div class="drawer-sheet" id="drawerSheet">
        <button class="drawer-close" onclick="cerrarFicha()"><i class="fas fa-times"></i></button>
        <div>
            <span id="drawerCat" style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-bronze); font-weight: 700;"></span>
            <h2 id="drawerTitle" style="font-family: 'Playfair Display', serif; font-size: 26px; margin: 8px 0 12px;"></h2>
            <div id="drawerPrice" style="font-size: 22px; font-weight: 700; margin-bottom: 15px;"></div>
            <img id="drawerImg" class="drawer-img" src="" alt="Producto">
            <p id="drawerDesc" style="font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 20px;"></p>
            
            <div style="background: var(--bg-washi); padding: 16px; border-radius: 12px; font-size: 12px; margin-bottom: 25px;">
                <p><strong>• Artesanía:</strong> Cincelado tradicional hecho a mano.</p>
                <p style="margin-top: 5px;"><strong>• Origen:</strong> Buenos Aires, Argentina.</p>
            </div>
        </div>
        <a id="drawerBtnWa" href="#" target="_blank" class="btn-whatsapp-drawer">
            <i class="fab fa-whatsapp"></i>
            <span>Consultar Disponibilidad</span>
        </a>
    </div>

    <!-- SCRIPTS CON SANITIZACIÓN & FILTROS -->
    <script>
        // Sanitizador estricto contra scripts e inyecciones
        function sanitizar(txt) {
            if (!txt) return '';
            return String(txt)
                .replace(/<[^>]*>?/gm, '')
                .replace(/["'`\\;{}()[\]]/g, '')
                .trim()
                .slice(0, 75);
        }

        function escaparHTML(txt) {
            if (!txt) return '';
            return String(txt)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const formatearMoneda = (n) => new Intl.NumberFormat('es-AR', { 
            style: 'currency', currency: 'ARS', maximumFractionDigits: 0 
        }).format(n);

        let catalogo = [];
        let productos = [];
        let catActual = 'todas';
        let ordenActual = 'destacados';

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const catUrl = params.get('cat');
            if (catUrl) catActual = catUrl;

            try {
                const res = await fetch('content/catalogo.json?v=' + Date.now());
                const data = await res.json();
                catalogo = data.categorias || [];

                productos = [];
                catalogo.forEach(c => {
                    (c.productos || []).forEach(p => {
                        const base = Number(p.precio_base) || 0;
                        const desc = Number(p.descuento) || 0;
                        const final = (desc > 0 && desc < 100) ? Math.round(base * (1 - (desc / 100))) : base;

                        productos.push({
                            ...p,
                            catId: c.id,
                            catNombre: c.nombre,
                            precioFinal: final,
                            descNum: desc,
                            baseNum: base
                        });
                    });
                });

                renderPills();
                renderCards();
            } catch (e) {
                document.getElementById('productosGrid').innerHTML = '<p style="text-align:center; width:100%;">Error al conectar con el catálogo.</p>';
            }
        }

        function renderPills() {
            const container = document.getElementById('pillsContainer');
            let html = `<button class="pill-btn ${catActual === 'todas' ? 'active' : ''}" onclick="setCat('todas')">Colección Completa</button>`;
            catalogo.forEach(c => {
                html += `<button class="pill-btn ${catActual === c.id ? 'active' : ''}" onclick="setCat('${escaparHTML(c.id)}')">${escaparHTML(c.nombre)}</button>`;
            });
            container.innerHTML = html;
        }

        function setCat(id) {
            catActual = id;
            renderPills();
            renderCards();
            window.history.replaceState({}, '', id === 'todas' ? 'tienda.html' : `tienda.html?cat=${encodeURIComponent(id)}`);
        }

        function cambiarOrden(val) {
            ordenActual = val;
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('productosGrid');
            const cont = document.getElementById('contadorProductos');
            const tit = document.getElementById('tituloTienda');

            let list = catActual === 'todas' ? [...productos] : productos.filter(p => p.catId === catActual);
            tit.textContent = catActual === 'todas' ? 'Catálogo de Piezas' : (catalogo.find(c => c.id === catActual)?.nombre || 'Piezas');

            if (ordenActual === 'precio-menor') list.sort((a,b) => a.precioFinal - b.precioFinal);
            if (ordenActual === 'precio-mayor') list.sort((a,b) => b.precioFinal - a.precioFinal);
            if (ordenActual === 'descuento') list.sort((a,b) => b.descNum - a.descNum);

            cont.textContent = `${list.length} pieza${list.length === 1 ? '' : 's'} disponible${list.length === 1 ? '' : 's'}`;

            if (list.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 40px 0; color: #888;">No hay piezas disponibles en esta categoría.</p>';
                return;
            }

            grid.innerHTML = list.map((p, idx) => {
                let badge = '';
                if (p.agotado) badge = `<span class="badge-tag badge-agotado">Agotado</span>`;
                else if (p.descNum > 0) badge = `<span class="badge-tag">${p.descNum}% OFF</span>`;

                const tachado = (p.descNum > 0 && !p.agotado) ? `<span class="price-strike">${formatearMoneda(p.baseNum)}</span>` : '';

                return `
                <article class="product-card" onclick="abrirFicha('${escaparHTML(p.nombre)}', '${escaparHTML(p.catNombre)}', '${formatearMoneda(p.precioFinal)}', 'assets/uploads/${escaparHTML(p.foto)}', '${escaparHTML(p.descripcion || '')}', ${p.agotado})">
                    <div class="img-wrap">
                        ${badge}
                        <img src="assets/uploads/${escaparHTML(p.foto)}" alt="${escaparHTML(p.nombre)}" loading="lazy">
                    </div>
                    <div class="card-details">
                        <div class="card-meta">
                            <span>${escaparHTML(p.catNombre)}</span>
                            <span>⭐ ${escaparHTML(p.rating || '5.0')}</span>
                        </div>
                        <h3 class="card-title">${escaparHTML(p.nombre)}</h3>
                        <div class="card-pricing">
                            <span class="price-current">${formatearMoneda(p.precioFinal)}</span>
                            ${tachado}
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        // CONTROL DEL DRAWER / FICHA TÉCNICA
        function abrirFicha(nombre, cat, precio, foto, desc, agotado) {
            document.getElementById('drawerTitle').textContent = nombre;
            document.getElementById('drawerCat').textContent = cat;
            document.getElementById('drawerPrice').textContent = precio;
            document.getElementById('drawerImg').src = foto;
            document.getElementById('drawerDesc').textContent = desc || "Pieza única trabajada con técnicas ancestrales de orfebrería y cuero vacuno de primera selección.";
            
            const btnWa = document.getElementById('drawerBtnWa');
            if (agotado) {
                btnWa.style.background = "#777";
                btnWa.textContent = "Pieza Agotada";
                btnWa.href = `https://wa.me/5491154251118?text=${encodeURIComponent('Hola! Quisiera consultar cuándo reingresa: ' + sanitizar(nombre))}`;
            } else {
                btnWa.style.background = "var(--text-primary)";
                btnWa.innerHTML = `<i class="fab fa-whatsapp"></i> Solicitar Pieza por WhatsApp`;
                btnWa.href = `https://wa.me/5491154251118?text=${encodeURIComponent('Hola! Quiero adquirir la pieza exclusiva: ' + sanitizar(nombre))}`;
            }

            document.getElementById('drawerOverlay').classList.add('active');
            document.getElementById('drawerSheet').classList.add('active');
        }

        function cerrarFicha() {
            document.getElementById('drawerOverlay').classList.remove('active');
            document.getElementById('drawerSheet').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
