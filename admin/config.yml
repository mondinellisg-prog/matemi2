backend:
  name: github
  repo: mondinellisg-prog/matemi2
  branch: main

media_folder: assets/uploads
public_folder: assets/uploads

collections:
  - name: tienda
    label: Administrador de Tienda
    files:
      - name: catalogo_completo
        label: Categorias y Productos
        file: content/catalogo.json
        fields:
          - label: Categorias
            name: categorias
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - label: Nombre de la Categoria
                name: nombre
                widget: string
                hint: "Ej: Mates, Termos, Mochilas"
              - label: Identificador
                name: id
                widget: string
                hint: "En minusculas y sin espacios. Ej: mates, termos, mochilas"
              - label: Foto para la Portada
                name: foto_portada
                widget: image
              - label: Productos de esta categoria
                name: productos
                widget: list
                summary: "{{fields.nombre}}"
                fields:
                  - label: Nombre del Producto
                    name: nombre
                    widget: string
                  - label: Precio Base ($)
                    name: precio_base
                    widget: number
                    value_type: int
                  - label: Porcentaje Descuento
                    name: descuento
                    widget: number
                    value_type: int
                    required: false
                  - label: Puntuacion
                    name: rating
                    widget: string
                    default: "5.0"
                    required: false
                  - label: Esta Agotado
                    name: agotado
                    widget: boolean
                    default: false
                  - label: Foto del Producto
                    name: foto
                    widget: image
                  - label: Descripcion
                    name: descripcion
                    widget: text
                    required: false